<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aa</title>
<!-- Design system 1's root stylesheet, its tokens and its faces, copied with Sync 1 (sync.json). -->
<link rel="stylesheet" href="/ds1/one.css">
<style>
  :root { color-scheme: light dark; }
  html, body { background: var(--background); color: var(--ds-text-color); }
  body { font-family: var(--ds-typeface-regular); font-feature-settings: var(--ds-font-features); font-size: var(--ds-type-size-default); line-height: var(--ds-unit); letter-spacing: var(--ds-type-letterspacing-default); }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(2 * var(--ds-unit)); max-width: calc(66 * var(--ds-unit)); margin: 0 auto; padding: calc(3 * var(--ds-unit)) var(--ds-unit); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { margin: 0; font: inherit; font-family: var(--ds-typeface-medium); font-weight: var(--ds-type-weight-bold); }
  .side { color: var(--ds-text-color-muted); }
  aa-editor { min-height: calc(20 * var(--ds-unit)); }
  pre { margin: 0; font-family: var(--typeface-mono); font-size: calc(13px * var(--ds-sf)); line-height: var(--ds-unit); letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* A row of one square, its words and buttons on the lower sixteen. */
  .bar { display: flex; align-items: flex-end; gap: var(--ds-unit); min-height: var(--ds-unit); margin-bottom: var(--ds-unit); line-height: calc(16px * var(--ds-sf)); }
  button { height: var(--ds-control-height); padding: 0 calc(4px * var(--ds-sf)); border: 0; border-radius: var(--ds-radius); background: var(--ds-fill); color: inherit; font: inherit; line-height: var(--ds-control-height); cursor: pointer; }
  button:hover { background: var(--ds-fill-hover); }
  button[aria-pressed="true"] { background: var(--ds-accent-color); color: var(--ds-button-text-color-on-accent); }
  button:focus-visible { outline: 2px solid var(--ds-focus-ring); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <section>
    <div class="bar"><h1>Aa</h1><button id="readonly" aria-pressed="false">Read only</button><button id="undo">Undo</button><button id="redo">Redo</button></div>
    <aa-editor id="editor" placeholder="Write" toolbar></aa-editor>
  </section>
  <section class="side">
    <div class="bar"><h1>What it stores</h1></div>
    <pre id="source"></pre>
  </section>
  <section>
    <div class="bar"><h1>Shared editing</h1><button id="share">Try two editors</button></div>
    <div id="shared-first"></div>
  </section>
  <section><div class="bar"><h1>Second editor</h1></div><div id="shared-second"></div></section>
</main>
<script type="module" src="/playground.ts"></script>
</body>
</html>
