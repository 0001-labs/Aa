<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aa</title>
<!-- Design system 1's root stylesheet, its tokens and its faces, copied with Sync 1 (sync.json). -->
<link rel="stylesheet" href="/ds1/one.css">
<style>
  /* Design system 1's scale: --sf is put on by startScaling() (playground.ts) before the first paint, and the
     components' own --ds-sf follows it, so on a phone every square, line and face is drawn a third larger. */
  :root { color-scheme: light dark; --ds-sf: var(--sf, 1); }
  html, body { background: var(--background); color: var(--ds-text-color); }
  body { font-family: var(--ds-typeface-regular); font-feature-settings: var(--ds-font-features); font-size: var(--ds-type-size-default); line-height: var(--ds-unit); letter-spacing: var(--ds-type-letterspacing-default); }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(2 * var(--ds-unit)); max-width: calc(66 * var(--ds-unit)); margin: 0 auto; padding: calc(3 * var(--ds-unit)) max(var(--ds-unit), env(safe-area-inset-right)) calc(3 * var(--ds-unit)) max(var(--ds-unit), env(safe-area-inset-left)); }
  /* One column on a narrow screen; minmax(0, 1fr), so a diagram wider than the screen scrolls within itself rather than widening the column. */
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  h1 { margin: 0; font: inherit; font-family: var(--ds-typeface-medium); font-weight: var(--ds-type-weight-bold); }
  .side { color: var(--ds-text-color-muted); }
  aa-editor { min-height: calc(20 * var(--ds-unit)); }
  .comments { margin-bottom: calc(2 * var(--ds-unit)); color: var(--ds-text-color); }
  .comments[hidden] { display: none; }
  pre { margin: 0; font-family: var(--typeface-mono); font-size: calc(13px * var(--ds-sf)); line-height: var(--ds-unit); letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* The foot, across both columns, as Design system 1's site ends its rail. */
  footer { grid-column: 1 / -1; }
  /* A row of one square, its words and buttons on the lower sixteen. */
  .bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 var(--ds-unit); min-height: var(--ds-unit); margin-bottom: var(--ds-unit); line-height: calc(16px * var(--ds-sf)); white-space: nowrap; }
  button, .link-button { display: inline-block; height: var(--ds-control-height); padding: 0 calc(4px * var(--ds-sf)); border: 0; border-radius: var(--ds-radius); background: var(--ds-fill); color: inherit; font: inherit; line-height: var(--ds-control-height); cursor: pointer; }
  .link-button { text-decoration: none; }
  button:hover, .link-button:hover { background: var(--ds-fill-hover); }
  button[aria-pressed="true"] { background: var(--ds-accent-color); color: var(--ds-button-text-color-on-accent); }
  button:focus-visible, .link-button:focus-visible { outline: 2px solid var(--ds-focus-ring); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <section>
    <div class="bar"><h1>Aa</h1><button id="readonly" aria-pressed="false">Read only</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="comments-beside" aria-pressed="false">Comments beside</button></div>
    <aa-editor id="editor" placeholder="Write" toolbar></aa-editor>
  </section>
  <section class="side">
    <div class="bar"><h1>What it stores</h1></div>
    <!-- The comments stand beside the text when asked; otherwise each thread opens at its words. -->
    <aside id="comments" class="comments" hidden></aside>
    <pre id="source"></pre>
  </section>
  <section>
    <div class="bar"><h1>Shared editing</h1><button id="share">Try two editors</button></div>
    <div id="shared-first"></div>
  </section>
  <section><div class="bar"><h1>Second editor</h1></div><div id="shared-second"></div></section>
  <footer class="bar"><a class="link-button" href="/start-here/overview/">Documentation</a><a class="link-button" href="https://designsystem1.com">Design system 1</a><a class="link-button" href="https://github.com/0001-labs/Aa">GitHub</a></footer>
</main>
<script type="module" src="/playground.ts"></script>
</body>
</html>
